        y: lane.y + 22,
        'text-anchor': 'middle',
        'class': 'fs-lane-label'
      });

      lg.appendChild(lt);
      lanesG.appendChild(lg);
    }
    svg.appendChild(lanesG);

    var groupsG = svgEl('g', { 'class': 'fs-groups' });

        x: grp.x,
        y: grp.y,
        width: grp.w,
        height: grp.h,
        rx: 10,
        'class': 'fs-group-box'
      }));
      var gt = svgEl('text', {
        x: grp.x + 12,
        y: grp.y + 18,
        'class': 'fs-group-label'

    var btnOut = document.getElementById('fs-zoom-out');
